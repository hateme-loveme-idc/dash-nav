name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Android SDK (preinstalled on the runner)
        run: yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | tail -1)/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Host tests
        run: app/hosttest/run.sh
      - name: Build APKs
        working-directory: app
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: dash-nav-${{ github.sha }}
          path: app/app/build/outputs/apk/**/*.apk
